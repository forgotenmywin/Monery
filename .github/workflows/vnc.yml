name: اجرای مرورگر با noVNC و F12 واقعی

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-novnc-f12
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium + noVNC + Cloudflare Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}

    steps:
      - name: Validate VNC password
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VNC_PASSWORD:-}" ]]; then
            echo "خطا: در GitHub Secret با نام VNC_PASSWORD بساز. رمز باید حداکثر ۸ کاراکتر باشد."
            exit 1
          fi
          if [[ ${#VNC_PASSWORD} -gt 8 ]]; then
            echo "خطا: VNC_PASSWORD نباید بیشتر از ۸ کاراکتر باشد."
            exit 1
          fi

      - name: Pull Chromium image and patch noVNC F12 button
        shell: bash
        run: |
          set -euo pipefail

          docker pull jlesage/chromium:latest

          BUILD_DIR="$RUNNER_TEMP/chromium-f12"
          mkdir -p "$BUILD_DIR"

          # Read the real noVNC page from the upstream image.
          docker create --name chromium-base jlesage/chromium:latest >/dev/null
          docker cp chromium-base:/opt/noVNC/index.html "$BUILD_DIR/index.html"
          docker rm chromium-base >/dev/null

          # Add a button inside noVNC Settings. It sends F12 through noVNC's
          # actual RFB connection to the remote Chromium window.
          python3 - "$BUILD_DIR/index.html" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          html = path.read_text(encoding="utf-8")

          marker = "UI.rfb.sendKey(0xFFC9, \"F12\");"
          if marker in html:
              raise SystemExit("F12 patch is already present; refusing to inject it twice.")

          pattern = re.compile(r"(?m)^(\s*)UI\.start\(\);\s*$")
          match = pattern.search(html)
          if not match:
              raise SystemExit("Could not find the expected UI.start() line in /opt/noVNC/index.html")

          indent = match.group(1)
          replacement = '''UI.start().then(() => {
              const settings = document.getElementById("settingsCollapse");
              if (!settings || document.getElementById("noVNC_devtools_f12_button")) return;

              const wrap = document.createElement("div");
              wrap.className = "mt-3";

              const button = document.createElement("button");
              button.id = "noVNC_devtools_f12_button";
              button.type = "button";
              button.className = "btn btn-outline-primary btn-sm w-100";
              button.textContent = "DevTools  (F12)";
              button.title = "Send F12 to the remote Chromium window. Press again to close DevTools.";

              const hint = document.createElement("div");
              hint.className = "form-text mt-1";
              hint.textContent = "برای باز کردن یا بستن DevTools، این دکمه را بزن.";

              button.addEventListener("click", () => {
                  if (!UI.rfb || !UI.connected) {
                      hint.textContent = "اتصال VNC هنوز برقرار نشده است.";
                      return;
                  }
                  try {
                      UI.rfb.sendKey(0xFFC9, "F12");
                      hint.textContent = "کلید F12 ارسال شد. برای بستن DevTools دوباره همین دکمه را بزن.";
                  } catch (error) {
                      console.error("Could not send F12 to Chromium:", error);
                      hint.textContent = "ارسال F12 ناموفق بود؛ اتصال VNC را بررسی کن.";
                  }
              });

              wrap.appendChild(button);
              wrap.appendChild(hint);
              settings.appendChild(wrap);
          }).catch((error) => console.error("noVNC initialization failed:", error));'''

          # Keep the indentation of the surrounding module script.
          replacement = "\n".join(indent + line if line else line for line in replacement.splitlines())
          html = html[:match.start()] + replacement + html[match.end():]
          path.write_text(html, encoding="utf-8")
          print("Patched noVNC Settings with a working remote F12 toggle button.")
          PY

          test -s "$BUILD_DIR/index.html"

          cat > "$BUILD_DIR/Dockerfile" <<'DOCKERFILE'
          FROM jlesage/chromium:latest
          COPY index.html /opt/noVNC/index.html
          DOCKERFILE

          docker build --pull -t chromium-f12:local "$BUILD_DIR"

      - name: Start Chromium container
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f chromium-f12 >/dev/null 2>&1 || true
          docker run -d \
            --name chromium-f12 \
            --shm-size=2g \
            --publish 5800:5800 \
            --env "VNC_PASSWORD=${VNC_PASSWORD}" \
            --env "KEEP_APP_RUNNING=1" \
            --restart unless-stopped \
            chromium-f12:local

          for attempt in $(seq 1 60); do
            if [[ "$(docker inspect -f '{{.State.Running}}' chromium-f12 2>/dev/null || true)" == "true" ]]; then
              if curl --silent --show-error --fail http://127.0.0.1:5800/ >/dev/null 2>&1; then
                echo "Chromium/noVNC is responding on port 5800."
                exit 0
              fi
            fi
            sleep 2
          done

          echo "Chromium/noVNC did not become ready. Recent container logs:"
          docker logs --tail 100 chromium-f12 || true
          exit 1

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          sudo dpkg -i "$RUNNER_TEMP/cloudflared.deb"
          cloudflared --version

      - name: Open Cloudflare Tunnel and keep session alive
        shell: bash
        run: |
          set -euo pipefail

          TUNNEL_LOG="$RUNNER_TEMP/cloudflared.log"
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:5800 >"$TUNNEL_LOG" 2>&1 &
          TUNNEL_PID=$!

          cleanup() {
            kill "$TUNNEL_PID" 2>/dev/null || true
            docker rm -f chromium-f12 >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          TUNNEL_URL=""
          for attempt in $(seq 1 60); do
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "cloudflared stopped unexpectedly. Log:"
              cat "$TUNNEL_LOG" || true
              exit 1
            fi

            TUNNEL_URL="$(grep -Eo 'https://[A-Za-z0-9-]+\.trycloudflare\.com' "$TUNNEL_LOG" | head -n 1 || true)"
            if [[ -n "$TUNNEL_URL" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$TUNNEL_URL" ]]; then
            echo "Could not obtain a trycloudflare.com URL. cloudflared log:"
            cat "$TUNNEL_LOG" || true
            exit 1
          fi

          {
            echo "## Chromium noVNC"
            echo
            echo "**URL:** $TUNNEL_URL"
            echo
            echo "**VNC password:** GitHub Secret `VNC_PASSWORD` (not printed here)."
            echo
            echo "Open the noVNC side panel → Settings → **DevTools (F12)**. Press the button again to close DevTools."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=noVNC URL::$TUNNEL_URL"
          echo "Tunnel is active. Workflow remains running for up to 6 hours."

          while kill -0 "$TUNNEL_PID" 2>/dev/null; do
            if [[ "$(docker inspect -f '{{.State.Running}}' chromium-f12 2>/dev/null || true)" != "true" ]]; then
              echo "Chromium container stopped. Recent logs:"
              docker logs --tail 100 chromium-f12 || true
              exit 1
            fi
            sleep 15
          done
