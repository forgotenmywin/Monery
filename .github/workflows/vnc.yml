name: اجرای مرورگر با noVNC (Cloudflare Tunnel)

on:
  workflow_dispatch:

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: اجرای کانتینر کروم
        run: |
          docker run -d \
            --name chromium \
            --restart unless-stopped \
            -e VNC_PASS=your_password \
            -e RESOLUTION=1280x720 \
            -p 5800:5800 \
            jlesage/chromium:latest

      - name: نصب cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: اجرای تونل Cloudflare
        run: |
          echo "⏳ منتظر آماده شدن Chromium..."
          sleep 15

          while ! nc -z localhost 5800; do
            echo "⏳ پورت 5800 آماده نیست..."
            sleep 2
          done

          echo "✅ پورت 5800 آماده است"

          cloudflared tunnel \
            --url http://localhost:5800 \
            --no-autoupdate > /tmp/cloudflared.log 2>&1 &

          sleep 10

          echo "===== CLOUDFLARE URL ====="
          grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/cloudflared.log || true

          echo "=========================="

          while true; do
            echo "🟢 مرورگر و تونل فعال هستند..."
            docker ps
            sleep 60
          done
