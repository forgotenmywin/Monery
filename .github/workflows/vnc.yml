
name: اجرای Chromium با noVNC و F12 واقعی

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-novnc-f12
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium + noVNC + Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      WEB_USERNAME: ${{ secrets.WEB_USERNAME }}
      WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}

    steps:

      # ==========================================
      # 1. Validate credentials
      # ==========================================

      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${WEB_USERNAME:-}" ]]; then
            echo "::error::WEB_USERNAME secret is missing."
            exit 1
          fi

          if [[ -z "${WEB_PASSWORD:-}" ]]; then
            echo "::error::WEB_PASSWORD secret is missing."
            exit 1
          fi

          echo "Web authentication credentials validated."

      # ==========================================
      # 2. Pull and patch Chromium image
      # ==========================================

      - name: Build Chromium with F12 button
        shell: bash
        run: |
          set -euo pipefail

          docker pull jlesage/chromium:latest

          BUILD_DIR="$RUNNER_TEMP/chromium-f12"

          mkdir -p "$BUILD_DIR"

          docker create \
            --name chromium-base \
            jlesage/chromium:latest

          docker cp \
            chromium-base:/opt/noVNC/index.html \
            "$BUILD_DIR/index.html"

          docker rm chromium-base

          python3 - "$BUILD_DIR/index.html" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          html = path.read_text(encoding="utf-8")

          marker = "noVNC_devtools_f12_button"

          if marker in html:
              raise SystemExit("F12 patch already exists.")

          pattern = re.compile(
              r"(?m)^(\s*)UI\.start\(\);\s*$"
          )

          match = pattern.search(html)

          if not match:
              raise SystemExit(
                  "Could not find UI.start() in noVNC index.html"
              )

          indent = match.group(1)

          replacement = r'''
          UI.start().then(() => {

              const settings =
                  document.getElementById("settingsCollapse");

              if (
                  !settings ||
                  document.getElementById("noVNC_devtools_f12_button")
              ) return;

              const wrap = document.createElement("div");
              wrap.className = "mt-3";

              const button = document.createElement("button");

              button.id = "noVNC_devtools_f12_button";
              button.type = "button";
              button.className = "btn btn-outline-primary btn-sm w-100";
              button.textContent = "DevTools (F12)";

              const hint = document.createElement("div");

              hint.className = "form-text mt-1";
              hint.textContent =
                  "برای باز کردن یا بستن DevTools دکمه را بزن.";

              button.addEventListener("click", () => {

                  if (!UI.rfb || !UI.connected) {
                      hint.textContent =
                          "اتصال VNC برقرار نیست.";
                      return;
                  }

                  try {

                      UI.rfb.sendKey(0xFFC9, "F12");

                      hint.textContent =
                          "F12 ارسال شد. برای بستن دوباره بزن.";

                  } catch (error) {

                      console.error(error);

                      hint.textContent =
                          "ارسال F12 ناموفق بود.";
                  }
              });

              wrap.appendChild(button);
              wrap.appendChild(hint);

              settings.appendChild(wrap);

          }).catch(error => {
              console.error(
                  "noVNC initialization failed:",
                  error
              );
          });
          '''

          replacement = "\n".join(
              indent + line if line else ""
              for line in replacement.strip("\n").splitlines()
          )

          html = (
              html[:match.start()]
              + replacement
              + html[match.end():]
          )

          path.write_text(html, encoding="utf-8")

          print("F12 button injected successfully.")
          PY

          test -s "$BUILD_DIR/index.html"

          cat > "$BUILD_DIR/Dockerfile" <<'DOCKERFILE'
          FROM jlesage/chromium:latest
          COPY index.html /opt/noVNC/index.html
          DOCKERFILE

          docker build \
            --pull \
            -t chromium-f12:local \
            "$BUILD_DIR"

      # ==========================================
      # 3. Start Chromium
      # ==========================================

      - name: Start Chromium container
        shell: bash
        run: |
          set -euo pipefail

          docker rm -f chromium-f12 >/dev/null 2>&1 || true

          docker run -d \
            --name chromium-f12 \
            --shm-size=2g \
            --publish 127.0.0.1:5800:5800 \
            --env "WEB_AUTHENTICATION=1" \
            --env "WEB_AUTHENTICATION_ALLOW_INSECURE=1" \
            --env "WEB_AUTHENTICATION_USERNAME=${WEB_USERNAME}" \
            --env "WEB_AUTHENTICATION_PASSWORD=${WEB_PASSWORD}" \
            --env "WEB_AUTHENTICATION_TOKEN_VALIDITY_TIME=24" \
            --env "KEEP_APP_RUNNING=1" \
            --restart unless-stopped \
            chromium-f12:local

          READY=0

          for attempt in $(seq 1 90); do

            if [[ "$(docker inspect -f '{{.State.Running}}' chromium-f12 2>/dev/null || true)" == "true" ]]; then

              if curl -fsS http://127.0.0.1:5800/ >/dev/null 2>&1; then
                READY=1
                break
              fi

            fi

            sleep 2
          done

          if [[ "$READY" != "1" ]]; then

            echo "::error::Chromium failed to start."

            docker logs --tail 150 chromium-f12 || true

            exit 1
          fi

          echo "Chromium and noVNC are ready."

      # ==========================================
      # 4. Authentication diagnostics
      # ==========================================

      - name: Verify authentication configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=== AUTHENTICATION SETTINGS ==="

          docker inspect chromium-f12 \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -E '^(WEB_AUTHENTICATION|WEB_AUTHENTICATION_ALLOW_INSECURE|WEB_AUTHENTICATION_USERNAME|WEB_AUTHENTICATION_PASSWORD)=' \
            | sed -E 's/WEB_AUTHENTICATION_PASSWORD=.*/WEB_AUTHENTICATION_PASSWORD=[REDACTED]/'

          echo
          echo "=== CONTAINER STATUS ==="

          docker inspect chromium-f12 \
            --format 'Running={{.State.Running}}'

          echo
          echo "=== AUTHENTICATION LOGS ==="

          docker logs --tail 100 chromium-f12 2>&1 \
            | grep -iE 'auth|password|vnc|error|web' \
            | sed -E 's/(password|passwd)[=: ]+[^ ]+/\1=[REDACTED]/Ig' \
            || true

      # ==========================================
      # 5. Install Cloudflare
      # ==========================================

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"

          sudo dpkg -i "$RUNNER_TEMP/cloudflared.deb"

          cloudflared --version

      # ==========================================
      # 6. Start public tunnel
      # ==========================================

      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail

          TUNNEL_LOG="$RUNNER_TEMP/cloudflared.log"

          cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:5800 \
            > "$TUNNEL_LOG" 2>&1 &

          TUNNEL_PID=$!

          cleanup() {

            kill "$TUNNEL_PID" 2>/dev/null || true

            docker rm -f chromium-f12 \
              >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          TUNNEL_URL=""

          for attempt in $(seq 1 90); do

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then

              echo "Cloudflare stopped."

              cat "$TUNNEL_LOG" || true

              exit 1
            fi

            TUNNEL_URL="$(
              grep -Eo 'https://[A-Za-z0-9-]+\.trycloudflare\.com' \
              "$TUNNEL_LOG" | head -n 1 || true
            )"

            if [[ -n "$TUNNEL_URL" ]]; then
              break
            fi

            sleep 2
          done

          if [[ -z "$TUNNEL_URL" ]]; then

            echo "::error::Could not obtain Cloudflare URL."

            cat "$TUNNEL_LOG" || true

            exit 1
          fi

          {
            echo "# Chromium noVNC"
            echo
            echo "**URL:** $TUNNEL_URL"
            echo
            echo "**Username:** GitHub Secret WEB_USERNAME"
            echo
            echo "**Password:** GitHub Secret WEB_PASSWORD"
            echo
            echo "Open noVNC Settings and use DevTools (F12)."
            echo
            echo "Session duration: up to 6 hours."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Chromium noVNC::$TUNNEL_URL"

          echo "======================================"
          echo "Chromium noVNC is ONLINE"
          echo "URL: $TUNNEL_URL"
          echo "Authentication: ENABLED"
          echo "F12 patch: ENABLED"
          echo "======================================"

          while kill -0 "$TUNNEL_PID" 2>/dev/null; do

            if [[ "$(docker inspect -f '{{.State.Running}}' chromium-f12 2>/dev/null || true)" != "true" ]]; then

              echo "::error::Chromium container stopped."

              docker logs --tail 100 chromium-f12 || true

              exit 1
            fi

            sleep 15
          done

          echo "Cloudflare tunnel exited unexpectedly."
          exit 1
