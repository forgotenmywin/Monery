name: اجرای مرورگر با noVNC (با Serveo)

on:
  workflow_dispatch:

jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - name: اجرای کانتینر کروم
        run: |
          docker run -d \
            --name chromium \
            -e VNC_PASS=your_password \
            -e RESOLUTION=1280x720 \
            -p 5800:5800 \
            jlesage/chromium:latest

      - name: نصب ssh (اختیاری)
        run: |
          sudo apt update
          sudo apt install openssh-client -y

      - name: ایجاد تونل با Serveo
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 80:localhost:5800 serveo.net &
          sleep 10
          echo "✅ لینک دسترسی شما:"
          echo "https://your-subdomain.serveo.net"
