name: اجرای مرورگر با noVNC (Cloudflare Tunnel)

on:
  workflow_dispatch:

jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - name: اجرای کانتینر کروم
        run: |
          docker run -d \
            --name chromium \
            -e VNC_PASS=your_password \
            -e RESOLUTION=1280x720 \
            -p 5800:5800 \
            jlesage/chromium:latest

      - name: نصب cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: اجرای تونل Cloudflare
        run: |
          cloudflared tunnel --url http://localhost:5800 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          sleep 10
          TUNNEL_URL=$(grep -o 'https://.*\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
          echo "✅ لینک دسترسی شما: $TUNNEL_URL"
